services:
  postgres-dev:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:-dev}
      POSTGRES_DB: sanilink_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanilink_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_DEV_PASSWORD:-dev}@postgres-dev:5432/sanilink_dev
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret}
    ports: ["8000:8000"]
    depends_on:
      postgres-dev:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ${FRONTEND_PATH:-../../SaniLink-Mobile/SaniLink-Frontend}:/frontend
      - frontend_node_modules:/frontend/node_modules
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-test}
      POSTGRES_DB: sanilink_test
    ports: ["5433:5432"]

volumes:
  frontend_node_modules: